apis:
- aid: librato:metrics-api
  name: Librato Metrics API
  description: 'RETIRED. JSON REST API for submitting and retrieving time-series measurements
    and for managing metrics, metric attributes, spaces, charts, dashboards, instruments,
    annotations, alerts, notification services, snapshots, jobs and API tokens. HTTP Basic
    authentication with an account email address as the user and an API token as the
    password, over HTTPS only. Consistent offset/length/orderby/sort pagination with a
    top-level "query" envelope. The host no longer resolves; the reference is preserved in
    the archived librato/api-docs repository.'
  humanURL: https://github.com/librato/api-docs
