status: retired
base_url: https://metrics-api.librato.com/v1
entities:
- name: Metric
  path: /v1/metrics
  item_path: /v1/metrics/:name
  key: name
  description: A named time series. Types include gauge and counter. Carries display and
    aggregation attributes plus a period and description.
  operations:
  - Create a Metric
  - Retrieve a Metric
  - Update a Metric
  - Delete a Metric
  - List All Metrics
  relationships:
  - type: has_many
    target: Measurement
    via: name
  - type: has_one
    target: MetricAttributes
    via: attributes
- name: Measurement
  path: /v1/measurements
  item_path: /v1/measurements/:metric_name
  description: An individual tagged data point submitted against a metric name. Submitted in
    batches with an optional top-level tags object; retrieved by metric name with duration
    and resolution parameters.
  operations:
  - Create a Measurement
  - Retrieve a Measurement
  relationships:
  - type: belongs_to
    target: Metric
    via: name
- name: MetricAttributes
  description: The attributes object embedded on a metric — summarize_function,
    display_units_long, display_units_short, display_min, display_stacked, gap_detection,
    aggregate, created_by_ua and related display/aggregation settings.
  embedded_in: Metric
  relationships:
  - type: belongs_to
    target: Metric
    via: attributes
- name: Space
  path: /v1/spaces
  item_path: /v1/spaces/:id
  key: id
  description: A dashboard container that holds charts. The current-generation replacement
    for the legacy Dashboard/Instrument pair.
  operations:
  - Create a Space
  - Retrieve a Space
  - Update a Space
  - Delete Space
  - List all Spaces
  relationships:
