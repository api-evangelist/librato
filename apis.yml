aid: librato
name: Librato
description: 'Librato was a hosted metrics, monitoring and analytics service for operational
  data — time-series measurements, tagged metrics, dashboards ("spaces"), charts, annotations,
  alerts and notification services — delivered as a developer-first SaaS with a JSON REST
  API at metrics-api.librato.com/v1. Backed by Cowboy Ventures among others, the San
  Francisco company was acquired by SolarWinds in 2015 for a reported $40 million, and its
  metrics platform was folded into SolarWinds AppOptics — released in November 2017 — which
  has itself since reached end of life. The librato.com domain and every product subdomain (metrics.,
  status., www.) now 301-redirect to the SolarWinds AppOptics end-of-life notice, the
  metrics-api.librato.com API host no longer resolves in DNS, and the github.com/librato
  organization was archived on 2024-01-02. This profile is retained as a historical record
  of a well-regarded developer API: the API reference source, the first-party Ruby, Python,
  Java and Node client libraries and the collection agents remain publicly archived and are
  catalogued here. The successor product is SolarWinds Observability SaaS.'
